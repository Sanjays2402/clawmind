apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawmind.fullname" . }}-api
  labels: {{- include "clawmind.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: clawmind-api }
  template:
    metadata:
      labels: { app: clawmind-api }
    spec:
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.api.port }} }]
          env:
            - { name: CLAWMIND_EMBED_URL, value: "http://{{ include "clawmind.fullname" . }}-embed:{{ .Values.embed.port }}" }
            - { name: CLAWMIND_DATA_DIR, value: "/var/clawmind" }
            - { name: CLAWMIND_API_HOST, value: "0.0.0.0" }
            - { name: CLAWMIND_SENTRY_DSN, value: {{ .Values.api.sentry.dsn | quote }} }
            - { name: CLAWMIND_SENTRY_ENVIRONMENT, value: {{ .Values.api.sentry.environment | quote }} }
            - { name: CLAWMIND_SENTRY_RELEASE, value: {{ .Values.api.sentry.release | quote }} }
            - { name: CLAWMIND_SENTRY_TRACES_SAMPLE_RATE, value: {{ .Values.api.sentry.tracesSampleRate | quote }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/clawmind }
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.api.port }} }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "clawmind.fullname" . }}-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
