apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawmind.fullname" . }}-api
  labels: {{- include "clawmind.labels" . | nindent 4 }}
spec:
  selector: { app: clawmind-api }
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
