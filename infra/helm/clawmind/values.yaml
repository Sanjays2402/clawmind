image:
  registry: ghcr.io
  repository: sanjays2402/clawmind
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 7410
  resources:
    limits: { cpu: "500m", memory: "512Mi" }
    requests: { cpu: "100m", memory: "256Mi" }
  # Sentry error tracking. Leave dsn empty to disable; the SDK is then
  # skipped at startup and nothing leaves the pod.
  sentry:
    dsn: ""
    environment: "production"
    release: ""
    tracesSampleRate: "0"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1

web:
  replicas: 1
  port: 7412
  resources:
    limits: { cpu: "500m", memory: "512Mi" }
    requests: { cpu: "50m", memory: "128Mi" }
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: false
    minAvailable: 1

embed:
  replicas: 1
  port: 7411
  model: "mlx-community/bge-small-en-v1.5-4bit"
  resources:
    limits: { cpu: "1000m", memory: "2Gi" }
    requests: { cpu: "200m", memory: "512Mi" }
  pdb:
    enabled: false
    minAvailable: 1

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

ingress:
  enabled: false
  className: nginx
  host: clawmind.local

# Pod-level security. These defaults satisfy the restricted PSS profile.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# NetworkPolicy locks east-west traffic to the chart's own pods plus
# anything labelled `clawmind.io/allow: api` (e.g. an ingress controller).
# When disabled the chart emits no NetworkPolicy and falls back to the
# cluster default (typically allow-all).
networkPolicy:
  enabled: false
  # Extra namespace selectors that may reach the API (e.g. ingress-nginx).
  extraIngressNamespaceSelectors: []
  # Egress is permitted to DNS plus chart-internal services by default.
  allowEgressToInternet: true

# Prometheus Operator integration. ServiceMonitor scrapes the API
# /metrics endpoint; PrometheusRule ships the alerts documented in the
# README's on-call section. Both default off so the chart still installs
# on clusters without prometheus-operator CRDs.
monitoring:
  serviceMonitor:
    enabled: false
    # Optional override, defaults to release namespace.
    namespace: ""
    # Match the Prometheus instance's serviceMonitorSelector.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    enabled: false
    namespace: ""
    # Match the Prometheus instance's ruleSelector.
    labels: {}
    interval: 30s
    # Regex Prometheus uses for the API job label. Override if your
    # scrape config names the job differently.
    jobRegex: "clawmind-api|.*-api"
    thresholds:
      downFor: 2m
      errorRateWindow: 5m
      errorRatePerSecond: 0.5
      errorRateFor: 10m
      latencyWindow: 5m
      askP95Seconds: 1
      latencyFor: 10m
      flapWindow: 10m
      flapChanges: 4
      flapFor: 5m
      # kube-state-metrics pod regex for the api pods.
      podRegex: ".*-api-.*"
